<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Claude Launcher — Settings</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 480px; }
    label { display: block; margin-bottom: .4rem; font-weight: bold; }
    input { width: 100%; padding: .5rem; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .5rem 1.2rem; font-size: 1rem; cursor: pointer; }
    #status { margin-top: .8rem; color: green; min-height: 1.2em; }
  </style>
</head>
<body>
  <h2>Claude Launcher Settings</h2>
  <label for="url">目標網址 / Target URL</label>
  <input id="url" type="url" placeholder="https://claude.ai">
  <button id="save">儲存 / Save</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>
